misconfigurations:
  - id: KSV-0125
    paths:
      - charts/tenant/templates/workload.yaml
      - charts/blastradius/templates/controlplane.yaml
    statement: Trivy does not know ghcr.io/erdilatifi/blastradius, the registry the release workflow signs every image into.
  - id: KSV-0037
    paths:
      - platform/observability/traefik.yaml
    statement: k3s installs Traefik from a HelmChart in kube-system, and a HelmChartConfig must sit next to it.
