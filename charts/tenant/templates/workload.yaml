{{- $tier := required "unknown tier" (index .Values.tiers .Values.tier) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload
  namespace: tenant-{{ .Values.name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: workload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload
        tenant: {{ required "name is required" .Values.name }}
    spec:
      priorityClassName: tenant
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: workload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workload
          image: {{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: {{ $tier.requests.cpuMillis }}m
              memory: {{ $tier.requests.memoryMiB }}Mi
            {{- if not $tier.unbounded }}{{ with $tier.limits }}
            limits:
              cpu: {{ .cpuMillis }}m
              memory: {{ .memoryMiB }}Mi
            {{- end }}{{ end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: workload
  namespace: tenant-{{ .Values.name }}
  labels:
    app.kubernetes.io/name: workload
spec:
  selector:
    app.kubernetes.io/name: workload
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: admin
      port: 9090
      targetPort: admin
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workload
  namespace: tenant-{{ .Values.name }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.name }}.blastradius.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workload
                port:
                  name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workload
  namespace: tenant-{{ .Values.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workload
  minReplicas: {{ .Values.replicas.min }}
  maxReplicas: {{ .Values.replicas.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: workload
  namespace: tenant-{{ .Values.name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workload
