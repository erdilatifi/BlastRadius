apiVersion: apps/v1
kind: Deployment
metadata:
  name: unsigned
  namespace: tenant-acme
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: unsigned
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unsigned
        tenant: acme
    spec:
      containers:
        - name: workload
          image: ghcr.io/erdilatifi/blastradius/workload:sha-f8eeeaf
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
