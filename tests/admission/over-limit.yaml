apiVersion: v1
kind: Pod
metadata:
  name: over-limit
  namespace: tenant-acme
  labels:
    tenant: acme
spec:
  containers:
    - name: workload
      image: ghcr.io/erdilatifi/blastradius/workload:sha-f8eeeaf
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "2"
          memory: "64Mi"
