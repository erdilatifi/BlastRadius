apiVersion: v1
kind: Pod
metadata:
  name: privileged
  namespace: tenant-acme
  labels:
    tenant: acme
spec:
  containers:
    - name: workload
      image: ghcr.io/erdilatifi/blastradius/workload:sha-f8eeeaf
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "64Mi"
