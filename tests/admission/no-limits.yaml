apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-limits
  namespace: tenant-acme
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: no-limits
  template:
    metadata:
      labels:
        app.kubernetes.io/name: no-limits
        tenant: acme
    spec:
      containers:
        - name: workload
          image: ghcr.io/erdilatifi/blastradius/workload:sha-f8eeeaf
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
