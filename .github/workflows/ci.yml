name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  rust:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cat versions.env >> "$GITHUB_ENV"
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy,rustfmt && rustup default "$RUST_VERSION"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run -p brctl -- tenant list

  web:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cat ../versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: reports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cat ../versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --group dev
      - run: ruff check
      - run: ruff format --check
      - run: pytest

  iac:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/toolchain.sh terraform tflint trivy
      - run: terraform fmt -check -recursive terraform
      - run: |
          for stack in terraform/cluster terraform/bootstrap; do
            terraform -chdir=$stack init -backend=false -input=false
            terraform -chdir=$stack validate
          done
      - run: tflint --recursive
        working-directory: terraform
      - run: trivy config --exit-code 1 --skip-dirs tests/admission --helm-values tenants/acme/values.yaml .

  manifests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/toolchain.sh helm kubeconform kyverno
      - run: |
          for values in tenants/*/values.yaml; do
            helm lint --strict charts/tenant -f "$values"
            helm template "$(basename "$(dirname "$values")")" charts/tenant -f "$values" | kubeconform -strict -summary
          done
      - run: kyverno test tests/admission

  e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TF_VAR_revision: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/toolchain.sh terraform kubectl k3d just
      - run: just up ci
      - run: |
          for t in $(ls tenants); do
            kubectl -n argocd wait --for=create "application/tenant-$t" --timeout=5m
            kubectl -n argocd wait --for=jsonpath='{.status.health.status}'=Healthy "application/tenant-$t" --timeout=5m
            created=$(kubectl -n argocd get "application/tenant-$t" -o jsonpath='{.metadata.creationTimestamp}')
            echo "tenant-$t Healthy $(( $(date +%s) - $(date -d "$created" +%s) ))s after its Application was created"
          done
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/cluster/kubeconfig
      - run: tests/isolation.sh acme globex
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/cluster/kubeconfig
      - if: failure()
        run: |
          kubectl -n argocd get applications -o yaml
          kubectl get pods,events -A
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/cluster/kubeconfig
      - if: always()
        run: just down
      - run: test -z "$(docker ps -aq --filter name=k3d-)$(docker network ls -q --filter name=k3d-)$(docker volume ls -q --filter name=k3d-)"
