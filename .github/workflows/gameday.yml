name: gameday

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      experiments:
        description: Catalog experiments to run against every tenant; empty runs them all, none runs none
        default: ""
      nodeLoss:
        description: Stop an agent node afterwards and measure each tenant's recovery
        type: boolean
        default: false

permissions: {}

concurrency: gameday-${{ github.ref }}

jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TF_VAR_revision: ${{ github.ref_name }}
      KUBECONFIG: ${{ github.workspace }}/terraform/cluster/kubeconfig
      EXPERIMENTS: ${{ inputs.experiments }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cat versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: scripts/toolchain.sh terraform kubectl k3d just
      - run: cargo build -q --release -p brctl
      - run: just up ci
      - run: |
          for t in $(ls tenants) ; do
            kubectl -n argocd wait --for=create "application/tenant-$t" --timeout=5m
            kubectl -n argocd wait --for=jsonpath='{.status.health.status}'=Healthy "application/tenant-$t" --timeout=5m
          done
          kubectl -n argocd wait --for=jsonpath='{.status.health.status}'=Healthy application/chaos-mesh --timeout=5m
          kubectl -n blastradius-system wait --for=create deployment/controlplane --timeout=5m
          kubectl -n blastradius-system rollout status deployment/controlplane --timeout=3m
      - run: |
          kubectl -n blastradius-system port-forward svc/controlplane 8080:8080 >/dev/null &
          kubectl -n monitoring port-forward svc/prometheus-operated 9091:9090 >/dev/null &
          sleep 3
          [ "$EXPERIMENTS" = none ] || target/release/brctl chaos campaign $EXPERIMENTS
          mkdir -p data
          target/release/brctl ledger export --environment actions --commit "$GITHUB_SHA" >> data/runs.jsonl
          target/release/brctl tenant list --json > "$RUNNER_TEMP/repo.json"
          python reports/capacity.py snapshot http://localhost:9091 "$RUNNER_TEMP/repo.json" data/usage.jsonl
          curl -s localhost:8080/api/incidents | jq -c '.[] | del(.markdown, .signals, .timeline)' >> data/incidents.jsonl
          mkdir -p postmortems
          curl -s localhost:8080/api/incidents | jq -c '.[]' | while read -r i; do
            jq -r .markdown <<<"$i" > "postmortems/$(jq -r '"\(.tenant)-\(.fingerprint)"' <<<"$i").md"
          done
      - if: inputs.nodeLoss
        run: scripts/node-loss.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postmortems
          path: postmortems
          if-no-files-found: ignore
      - if: github.ref == 'refs/heads/main'
        run: python reports/scorecard.py data/runs.jsonl README.md
      - if: github.ref == 'refs/heads/main'
        run: |
          alarm=$(python reports/capacity.py alarm data/usage.jsonl)
          [ -z "$alarm" ] || gh issue create --title "Capacity forecast: under 14 days to the gate" --body "$alarm"
      - if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add data README.md
          git commit -m "Record game day runs"
          git pull --rebase origin main
          git push origin HEAD:main
      - if: always()
        run: just down
