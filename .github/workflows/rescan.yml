name: rescan

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/toolchain.sh trivy
      - run: |
          failed=0
          for tag in $(sed -n 's/^  tag: //p' tenants/*/values.yaml | sort -u); do
            image=ghcr.io/${GITHUB_REPOSITORY,,}/workload:$tag
            trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$image" > report.txt && continue
            failed=1
            title="Vulnerabilities in workload:$tag"
            if [ "$(gh issue list --state open --search "$title in:title" --json number --jq length)" = 0 ]; then
              head -c 60000 report.txt | gh issue create --title "$title" --body-file -
            fi
          done
          exit $failed
        env:
          GH_TOKEN: ${{ github.token }}
