apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blastradius
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: charts/blastradius
    helm:
      valueFiles:
        - ../tenant/values.yaml
        - ../../platform/capacity.yaml
        - ../../platform/chaos/catalog.yaml
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: blastradius-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
